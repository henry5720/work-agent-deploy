[slack]
bot_token = "${SLACK_BOT_TOKEN}"
app_token = "${SLACK_APP_TOKEN}"

# OpenAB 0.10 applies this allowlist to DMs too. Keep channels open so DMs work;
# access is bounded by allowed_users and by inviting the app only to approved channels.
allow_all_channels = true
allow_all_users = false
allowed_users = [
  "U0B54FKJ93R",
  "U0B5PH9P62G",
  "U0B80QH6K63",
  "U0B85LX4KKP",
  "U0B8ASE0ARX",
  "U0B8B04R57T",
  "U0B8FA5B8KY",
  "U0B8CNK8GNQ",
  "U0B8P01RD5Z",
  "U0B9394SCRW",
  "U0B9AQUMGJC",
  "U0B9BHVKXDE",
  "U0BAC3AHMLK",
  "U0BALPYFU3S",
  "U0BKK22JC5Q",
  "U0BKS08HJUB",
  "U0BPD5T8FQE",
]
allow_bot_messages = "off"
allow_user_messages = "involved"
assistant_mode = false
streaming = false

# 預設 runtime：OpenCode 原生 ACP（`opencode acp`），模型與 OMO 設定在
# config/opencode/。要切回 Claude ACP 就把 config/versions.env 的
# OPENAB_AGENT_RUNTIME 改成 claude，OpenAB 會改讀 config/openab.claude-acp.toml。
# 這個檔案的 [slack]、[pool]、[reactions] 三節必須和 rollback config 逐字相同，
# tests/static.sh 會比對；只有 [agent] 允許不一樣。
[agent]
command = "opencode"
args = ["acp"]
working_dir = "/home/node/code"
inherit_env = [
  "COMPANY_GATEWAY_API_KEY",
  "COMPANY_GATEWAY_BASE_URL",
  "OPENCODE_CONFIG_DIR",
  "CLAUDE_CODE_EXECUTABLE",
  "CLAUDE_CONFIG_DIR",
  "PARSE_DOCUMENT_ALLOWED_HOST",
  "DOCLING_ARTIFACTS_PATH",
  "SLACK_BOT_TOKEN",
  "SLACK_LIST_ID",
  "SLACK_TEAM_ID",
  "WORK_HELPER_ISSUE_MODE",
]

# 音檔只會在部署維護者確認另一個 OpenAI-compatible STT endpoint 後才啟用。公司
# gateway 不因此被假定支援 STT；未啟用時 OpenAB 不轉錄，bot 必須明確回覆 audio 不支援。
# endpoint 是 STT_BASE_URL + /audio/transcriptions，詳見 OpenAB 的 [stt] 文件。
[stt]
enabled = false
api_key = "${STT_API_KEY}"
base_url = "${STT_BASE_URL}"
model = "whisper-large-v3-turbo"
echo_transcript = false

[filestore]
# Incoming attachments use Cloudflare R2. Credentials stay in the deployment
# host's env/openab.env and are interpolated at runtime; never put their values
# here.
bucket = "work-agent-attachments"
endpoint = "https://99de68928da234ebcf0c9370443ad7ee.r2.cloudflarestorage.com"
region = "auto"
prefix = "incoming/"
presigned_ttl = 3600
max_file_size_mb = 50
access_key_id = "${R2_ACCESS_KEY_ID}"
secret_access_key = "${R2_SECRET_ACCESS_KEY}"

[pool]
max_sessions = 10
session_ttl_hours = 4

[reactions]
enabled = true
remove_after_reply = true
tool_display = "compact"
