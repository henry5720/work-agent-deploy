[slack]
bot_token = "${SLACK_BOT_TOKEN}"
app_token = "${SLACK_APP_TOKEN}"

# OpenAB 0.10 applies this allowlist to DMs too. Keep channels open so DMs work;
# access is bounded by allowed_users and by inviting the app only to approved channels.
allow_all_channels = true
allow_all_users = false
allowed_users = [
  "U0B54FKJ93R",
  "U0B5PH9P62G",
  "U0B80QH6K63",
  "U0B85LX4KKP",
  "U0B8ASE0ARX",
  "U0B8B04R57T",
  "U0B8FA5B8KY",
  "U0B8CNK8GNQ",
  "U0B8P01RD5Z",
  "U0B9394SCRW",
  "U0B9AQUMGJC",
  "U0B9BHVKXDE",
  "U0BAC3AHMLK",
  "U0BALPYFU3S",
  "U0BKK22JC5Q",
  "U0BKS08HJUB",
  "U0BPD5T8FQE",
]
allow_bot_messages = "off"
allow_user_messages = "involved"
assistant_mode = false
streaming = false

[agent]
command = "claude-agent-acp"
args = []
working_dir = "/home/node/code"
inherit_env = [
  "SLACK_BOT_TOKEN",
  "SLACK_LIST_ID",
  "SLACK_TEAM_ID",
  "WORK_HELPER_ISSUE_MODE",
]

[pool]
max_sessions = 10
session_ttl_hours = 4

[reactions]
enabled = true
remove_after_reply = true
tool_display = "compact"
