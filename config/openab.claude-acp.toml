[slack]
bot_token = "${SLACK_BOT_TOKEN}"
app_token = "${SLACK_APP_TOKEN}"

# OpenAB 0.10 applies this allowlist to DMs too. Keep channels open so DMs work;
# access is bounded by allowed_users and by inviting the app only to approved channels.
allow_all_channels = true
allow_all_users = false
allowed_users = [
  "U0B54FKJ93R",
  "U0B5PH9P62G",
  "U0B80QH6K63",
  "U0B85LX4KKP",
  "U0B8ASE0ARX",
  "U0B8B04R57T",
  "U0B8FA5B8KY",
  "U0B8CNK8GNQ",
  "U0B8P01RD5Z",
  "U0B9394SCRW",
  "U0B9AQUMGJC",
  "U0B9BHVKXDE",
  "U0BAC3AHMLK",
  "U0BALPYFU3S",
  "U0BKK22JC5Q",
  "U0BKS08HJUB",
  "U0BPD5T8FQE",
]
allow_bot_messages = "off"
allow_user_messages = "involved"
assistant_mode = false
streaming = false

# Claude ACP rollback。啟用方式：把 config/versions.env 的
# OPENAB_AGENT_RUNTIME 改成 claude，再跑 ./scripts/deploy.sh。那會一併把 base image
# 換成 OPENAB_IMAGE_CLAUDE。這是保留的 rollback config，不是預設正式 runtime。
#
# 這個檔案的 [slack]、[pool]、[reactions] 三節必須和 config/openab.toml 逐字相同，
# tests/static.sh 會比對；只有 [agent] 允許不一樣。
[agent]
command = "claude-agent-acp"
args = []
working_dir = "/home/node/code"
# COMPANY_GATEWAY_* 在這條路徑不是給模型用的（Claude ACP 走 Claude 訂閱），是給
# `company-image` 用的。少了它們，rollback 就只剩「文件上有生圖」而沒有實際路徑。
inherit_env = [
  "COMPANY_GATEWAY_API_KEY",
  "COMPANY_GATEWAY_BASE_URL",
  "SLACK_BOT_TOKEN",
  "SLACK_LIST_ID",
  "SLACK_TEAM_ID",
  "WORK_HELPER_ISSUE_MODE",
  "CLAUDE_CODE_EXECUTABLE",
  "CLAUDE_CONFIG_DIR",
  "PARSE_DOCUMENT_ALLOWED_HOST",
  "DOCLING_ARTIFACTS_PATH",
]

# 與預設 runtime 相同：只在已填 STT_BASE_URL / STT_API_KEY、且確認 endpoint 支援
# /audio/transcriptions 後，維護者才把 enabled 改成 true。
[stt]
enabled = false
api_key = "${STT_API_KEY}"
base_url = "${STT_BASE_URL}"
model = "whisper-large-v3-turbo"
echo_transcript = false

[filestore]
# Incoming attachments use the same Cloudflare R2 filestore as the default
# runtime. Credentials stay in the deployment host's env/openab.env and are
# interpolated at runtime; never put their values here.
bucket = "work-agent-attachments"
endpoint = "https://99de68928da234ebcf0c9370443ad7ee.r2.cloudflarestorage.com"
region = "auto"
prefix = "incoming/"
presigned_ttl = 3600
max_file_size_mb = 50
access_key_id = "${R2_ACCESS_KEY_ID}"
secret_access_key = "${R2_SECRET_ACCESS_KEY}"

[pool]
max_sessions = 10
session_ttl_hours = 4

[reactions]
enabled = true
remove_after_reply = true
tool_display = "compact"
