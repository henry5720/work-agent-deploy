name: work-agent

services:
  backlog-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: work-agent-openab:0.10.0-beta.3-python3
    container_name: work-agent
    restart: unless-stopped
    env_file:
      - path: env/openab.env
        required: false
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      CODEGRAPH_TELEMETRY: "0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 6.0
    mem_limit: 8g
    pids_limit: 1024
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=1g,mode=1777
    # `z` relabels bind mounts for SELinux hosts and is a no-op elsewhere.
    volumes:
      - ./config/openab.toml:/etc/openab/config.toml:ro,z
      - ./agents/CLAUDE.md:/home/node/CLAUDE.md:ro,z
      - ./managed-claude-settings.json:/home/node/.claude/settings.json:ro,z
      - claude-credentials:/home/node/.claude
      - ./runtime/openab:/home/node/.openab:z
      - ./runtime/drafts:/home/node/drafts:z
      # One mount for the whole snapshot root: adding a repo only touches
      # config/repos.conf. Skills register from the work-helper snapshot.
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}:/home/node/code:ro,z
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}/work-helper/skills:/home/node/.claude/skills:ro,z
      # CodeGraph indexes are SQLite in WAL mode, so they need a writable path.
      # Each snapshot's .codegraph is a relative symlink into this one directory,
      # which keeps repo source read-only and adding a repo free of Compose edits.
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}/.index:/home/node/code/.index:z

volumes:
  claude-credentials:
