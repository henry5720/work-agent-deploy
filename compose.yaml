name: work-agent

# 這份檔案可直接由 `docker compose` 使用。image 與 build args 對應
# config/versions.env 的 checked-in pins；不要改成 floating tag。
services:
  backlog-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENAB_IMAGE: ghcr.io/openabdev/openab:0.10.0-beta.3-opencode@sha256:44abe31bc0cdb462e1177930590ce52c597e454ea817cd744b5f360875009561
        OPENCODE_VERSION: 1.18.13
        OMO_VERSION: 2.2.15
        CODEGRAPH_VERSION: 1.5.0
        CLAUDE_AGENT_ACP_VERSION: 0.70.0
        CLAUDE_CODE_VERSION: 2.1.236
        DOCLING_VERSION: 2.121.0
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: work-agent-openab:0.10.0-opencode
    container_name: work-agent
    restart: unless-stopped
    env_file:
      - path: env/openab.env
        required: false
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      CLAUDE_AGENT_ACP_VERSION: 0.70.0
      CLAUDE_AGENT_ACP_BIN: /usr/local/bin/claude-agent-acp
      CLAUDE_CODE_VERSION: 2.1.236
      CLAUDE_CODE_EXECUTABLE: /usr/local/bin/claude
      OPENCODE_CONFIG_DIR: /home/node/.config/opencode
      # OpenCode 1.18.13 writes XDG state under ~/.local/state by default; route
      # it to the existing writable opencode-state volume instead of read-only home.
      XDG_STATE_HOME: /home/node/.opencode
      CODEGRAPH_TELEMETRY: "0"
      DOCLING_ARTIFACTS_PATH: /opt/docling-models
      # parse-document only accepts attachment URLs from this R2 host. This
      # is a host allowlist, not an R2 credential or an API validation.
      PARSE_DOCUMENT_ALLOWED_HOST: 99de68928da234ebcf0c9370443ad7ee.r2.cloudflarestorage.com
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 6.0
    mem_limit: 8g
    pids_limit: 1024
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=1g,mode=1777
    # `z` relabels bind mounts for SELinux hosts and is a no-op elsewhere.
    volumes:
      # OpenAB 唯一 runtime config。
      - ./config/openab.toml:/etc/openab/config.toml:ro,z
      # agent 規則只有 agents/CLAUDE.md 一份。Claude Code 直接讀這個路徑；
      # OpenCode 由 config/opencode/opencode.json 的 `instructions` 指過來。
      - ./agents/CLAUDE.md:/home/node/CLAUDE.md:ro,z
      # OPENCODE_CONFIG_DIR 整個唯讀會讓 `opencode acp` 一開機就死在
      # `FileSystem.writeFile (.../.gitignore)`：OpenCode 自己要在 config dir 寫
      # `.gitignore` 與 state。所以目錄給一個可寫的 named volume，設定正本改成單檔
      # 唯讀疊在上面 —— agent 改不掉 provider／permission，OpenCode 仍寫得進去。
      # Compose 依 target 深度掛載，父層 volume 先於下面兩個檔案 bind。
      # 在 config/opencode/ 加檔案要一起加一行；tests/static.sh 會比對目錄內容。
      - opencode-config:/home/node/.config/opencode
      - ./config/opencode/opencode.json:/home/node/.config/opencode/opencode.json:ro,z
      - ./config/opencode/oh-my-opencode-slim.json:/home/node/.config/opencode/oh-my-opencode-slim.json:ro,z
      # Claude Code credential/state volume；settings 仍是既有 rollback runtime 的設定檔。
      - claude-credentials:/home/node/.claude
      - ./managed-claude-settings.json:/home/node/.claude/settings.json:ro,z
      # OpenCode 的 auth、session storage 與 plugin/npm cache 必須可寫，而
      # rootfs 是唯讀的，所以各給一個 named volume。
      - opencode-data:/home/node/.local/share/opencode
      - opencode-cache:/home/node/.cache
      # OPENCODE_CONFIG_DIR 之外，OpenCode 還有自己的 state root `~/.opencode`，
      # 一樣要在裡面寫 `.gitignore` 與 state。少這一個 mount 時 `opencode acp` 會用
      # 同一種方式死掉：`FileSystem.writeFile (/home/node/.opencode/.gitignore)`，
      # OpenAB 端只看到 ACP 連線關掉。所以只給這一個路徑一個 named volume，
      # /home/node 整層維持唯讀 —— 把 home 改可寫等於把上面所有唯讀 mount 的意義拿掉。
      # 這個路徑不是下面的 /home/node/.openab（OpenAB 自己的 state），兩個都要在。
      - opencode-state:/home/node/.opencode
      - ./runtime/openab:/home/node/.openab:z
      - ./runtime/drafts:/home/node/drafts:z
      # One mount for the whole snapshot root: adding a repo only touches
      # config/repos.conf. Skills register from the agent-config snapshot.
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}:/home/node/code:ro,z
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}/agent-config/skills:/home/node/.claude/skills:ro,z
      # CodeGraph indexes are SQLite in WAL mode, so they need a writable path.
      # Each snapshot's .codegraph is a relative symlink into this one directory,
      # which keeps repo source read-only and adding a repo free of Compose edits.
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}/.index:/home/node/code/.index:z

volumes:
  claude-credentials:
  opencode-config:
  opencode-state:
  opencode-data:
  opencode-cache:
