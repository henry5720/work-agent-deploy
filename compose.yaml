name: work-agent

# 版本與 runtime 的正本是 config/versions.env。一律用 ./scripts/compose.sh 進入，
# 直接 `docker compose` 會因為 OPENAB_IMAGE 未設定而中止。
services:
  backlog-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENAB_IMAGE: ${OPENAB_IMAGE:?run ./scripts/compose.sh, not docker compose}
        OPENAB_AGENT_RUNTIME: ${OPENAB_AGENT_RUNTIME:?run ./scripts/compose.sh, not docker compose}
        OPENCODE_VERSION: ${OPENCODE_VERSION:?run ./scripts/compose.sh, not docker compose}
        OMO_VERSION: ${OMO_VERSION:?run ./scripts/compose.sh, not docker compose}
        CODEGRAPH_VERSION: ${CODEGRAPH_VERSION:?run ./scripts/compose.sh, not docker compose}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: work-agent-openab:${OPENAB_VERSION}-${OPENAB_AGENT_RUNTIME}
    container_name: work-agent
    restart: unless-stopped
    env_file:
      - path: env/openab.env
        required: false
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      OPENCODE_CONFIG_DIR: /home/node/.config/opencode
      CODEGRAPH_TELEMETRY: "0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 6.0
    mem_limit: 8g
    pids_limit: 1024
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=1g,mode=1777
    # `z` relabels bind mounts for SELinux hosts and is a no-op elsewhere.
    volumes:
      # OpenAB config：opencode acp 是預設，config/openab.claude-acp.toml 是 rollback。
      - ${OPENAB_CONFIG:?run ./scripts/compose.sh, not docker compose}:/etc/openab/config.toml:ro,z
      # agent 規則只有 agents/CLAUDE.md 一份。Claude Code 直接讀這個路徑；
      # OpenCode 由 config/opencode/opencode.json 的 `instructions` 指過來。
      - ./agents/CLAUDE.md:/home/node/CLAUDE.md:ro,z
      - ./config/opencode:/home/node/.config/opencode:ro,z
      - ./managed-claude-settings.json:/home/node/.claude/settings.json:ro,z
      - claude-credentials:/home/node/.claude
      # OpenCode 的 auth、session storage 與 plugin/npm cache 必須可寫，而
      # rootfs 是唯讀的，所以各給一個 named volume。
      - opencode-data:/home/node/.local/share/opencode
      - opencode-cache:/home/node/.cache
      - ./runtime/openab:/home/node/.openab:z
      - ./runtime/drafts:/home/node/drafts:z
      # One mount for the whole snapshot root: adding a repo only touches
      # config/repos.conf. Skills register from the work-helper snapshot.
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}:/home/node/code:ro,z
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}/work-helper/.claude/skills:/home/node/.claude/skills:ro,z
      # CodeGraph indexes are SQLite in WAL mode, so they need a writable path.
      # Each snapshot's .codegraph is a relative symlink into this one directory,
      # which keeps repo source read-only and adding a repo free of Compose edits.
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}/.index:/home/node/code/.index:z

volumes:
  claude-credentials:
  opencode-data:
  opencode-cache:
